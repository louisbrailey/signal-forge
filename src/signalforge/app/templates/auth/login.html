{% extends "base.html" %}
{% block title %}Sign in — Signal Forge{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-xl font-semibold text-slate-900">Sign in</h1>
  <p class="mt-1 text-sm text-slate-500">Local single-user access. This app binds to loopback only.</p>

  {% if error %}
  <p class="mt-4 rounded border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <input type="hidden" name="next" value="{{ next }}" />
    <div>
      <label class="block text-sm font-medium text-slate-700" for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700" for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2" />
    </div>
    <button type="submit"
            class="w-full rounded bg-slate-900 px-3 py-2 text-white hover:bg-slate-700">Sign in</button>
  </form>
</div>
{% endblock %}
