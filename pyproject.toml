[project]
name = "signalforge"
version = "0.1.0"
description = "Signal Forge — local-first, paper-trading-only market research & trade-recommendation platform (research/education only)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Personal-Use-Only" }
authors = [{ name = "Louis Brailey" }]

# Runtime dependencies. Deliberately conservative for Phase 1.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "structlog>=24.4",
    "apscheduler>=3.11,<4",
    "numpy>=2.1",
    "pandas>=2.2",
    "pandas-market-calendars>=4.4",
    "python-dateutil>=2.9",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.9",
    "cryptography>=44.0",
]

[project.optional-dependencies]
# The LLM explanation layer is OPTIONAL. The system is fully functional without it.
# It is never imported by research/, risk/, backtest/, or paper/ (enforced by import-linter).
llm = ["anthropic>=0.42"]
# Postgres backend for the always-on Docker Compose deployment (local dev stays SQLite).
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
signalforge = "signalforge.cli:main"

# Installed by default with `uv sync`.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.122",
    "freezegun>=1.5",
    "ruff>=0.8.4",
    "black>=24.10",
    "mypy>=1.13",
    "import-linter>=2.1",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "types-python-dateutil",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalforge"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes / pycodestyle
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "PTH",              # use pathlib
    "RUF",              # ruff-specific
    "TID",              # tidy imports (banned-api)
    "S",                # flake8-bandit (security)
]
ignore = [
    "S101",    # assert used — fine in tests and internal invariants
    "B008",    # function call in argument defaults — FastAPI Depends() idiom
    "RUF022",  # __all__ is grouped by domain with section comments, not sorted
    "RUF001",  # intentional typographic dashes (– / —) in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"src/signalforge/db/migrations/**" = ["E501", "F401"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Hard denylist: brokerage / execution / browser-automation surfaces must never be importable.
"ib_insync".msg = "No brokerage connectivity. See ARCHITECTURE.md S1."
"ibapi".msg = "No brokerage connectivity. See ARCHITECTURE.md S1."
"alpaca_trade_api".msg = "No brokerage/trading API. Data-only adapters live in signalforge.data.adapters."
"selenium".msg = "No browser automation of any venue. See ARCHITECTURE.md S1."
"ccxt".msg = "Out of scope: no crypto exchange connectivity."

[tool.black]
line-length = 100
target-version = ["py312"]

# ---------------------------------------------------------------------------
# mypy — strict on the deterministic decision core
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["signalforge"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["signalforge.research.*", "signalforge.risk.*", "signalforge.backtest.*"]
disallow_any_generics = true
warn_return_any = true
strict_equality = true

# Feature math is numpy-heavy; numpy's stubs surface as Any. The decision logic
# (strategies, scan, rank, candidates, risk) keeps the strict settings above.
[[tool.mypy.overrides]]
module = ["signalforge.research.features.*"]
warn_return_any = false
disallow_any_generics = false

# Third-party packages without bundled type information.
[[tool.mypy.overrides]]
module = ["pandas_market_calendars.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers --cov=signalforge --cov-report=term-missing:skip-covered"
asyncio_mode = "auto"
markers = [
    "safety: invariant tests (S1-S10 from ARCHITECTURE.md) — must always pass",
    "slow: longer-running tests (backtests over large synthetic series)",
]

[tool.coverage.run]
branch = true
source = ["src/signalforge"]
omit = ["src/signalforge/db/migrations/*", "src/signalforge/cli.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]

# ---------------------------------------------------------------------------
# import-linter — architectural safety contracts (S1, S2, S3)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "signalforge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "S3: LLM layer is never on the deterministic decision path"
type = "forbidden"
source_modules = [
    "signalforge.research",
    "signalforge.risk",
    "signalforge.backtest",
    "signalforge.paper",
]
forbidden_modules = ["signalforge.llm"]

[[tool.importlinter.contracts]]
name = "S2: manual CSV portfolio import performs no network I/O"
type = "forbidden"
source_modules = ["signalforge.portfolio"]
forbidden_modules = ["httpx", "requests", "aiohttp", "socket", "urllib", "signalforge.data"]

[[tool.importlinter.contracts]]
name = "S1: no brokerage / execution / browser-automation surface anywhere"
type = "forbidden"
source_modules = ["signalforge"]
forbidden_modules = ["ib_insync", "ibapi", "alpaca_trade_api", "selenium", "ccxt"]

[[tool.importlinter.contracts]]
name = "Layering: data adapters do not depend on research/paper/app/alerts"
type = "forbidden"
source_modules = ["signalforge.data.adapters"]
forbidden_modules = [
    "signalforge.research", "signalforge.risk", "signalforge.backtest",
    "signalforge.paper", "signalforge.app", "signalforge.alerts",
]

[[tool.importlinter.contracts]]
name = "S11: options are education/simulation only — no alerts, no LLM, no decision path"
type = "forbidden"
# Widened, never narrowed: the two new options data modules are covered by the
# same contract as the backfill they belong to. The coverage summary is a
# RETURN VALUE, so the dependency arrow runs research -> data.options_backfill,
# which this contract permits; the backfill never imports research and never
# writes a research row.
source_modules = [
    "signalforge.options",
    "signalforge.data.options_backfill",
    "signalforge.data.options_cycles",
    "signalforge.data.options_corporate_actions",
    "signalforge.data.options_merge",
]
forbidden_modules = [
    "signalforge.alerts",
    "signalforge.llm",
    "signalforge.research.scan",
    "signalforge.research.candidates",
    "signalforge.paper.ledger",
]

[[tool.importlinter.contracts]]
# S11a NAMES the options engine's LLM-freedom instead of leaving it to be inherited
# by the accident of package placement (D2 §2.1).  S3 already covers
# signalforge.backtest and signalforge.research, but NOT signalforge.data — so
# option_chain.py and options_calendar.py were unconstrained, and options_calendar
# is precisely the module the OMS must cross-check its broker clock against
# (program map §6.4).  This contract ships INSIDE I-O3, the commit that creates
# those modules: under any later placement there is no sequencing that guarantees
# the contract exists when the module does.
#
# signalforge.execution does not exist yet and must not be importable from here if
# it ever does — import-linter ignores a forbidden module that is absent, so the
# name is listed now rather than added in the commit that would need it.
name = "S11a: the options engine/calendar are off the LLM and alert paths, and off the order path"
type = "forbidden"
source_modules = [
    "signalforge.backtest.options_engine",
    "signalforge.backtest.options_pricing",
    "signalforge.backtest.options_costs",
    "signalforge.backtest.options_leakage",
    "signalforge.data.option_chain",
    "signalforge.data.options_calendar",
]
forbidden_modules = [
    "signalforge.llm",
    "signalforge.alerts",
    "signalforge.execution",
]

[[tool.importlinter.contracts]]
name = "S12: news never drives a recommendation or risk decision"
type = "forbidden"
source_modules = [
    "signalforge.research.scan",
    "signalforge.research.candidates",
    "signalforge.research.strategies",
    "signalforge.risk",
]
# NOTE: this contract previously named a "signalforge.news" module that does
# not exist anywhere in the source tree, so it enforced nothing — it passed
# only because import-linter can never find an import of a module that isn't
# there. The real news code lives at these three paths; found and fixed
# 2026-09-08 while verifying the Massive/Benzinga news integration is
# genuinely kept off the decision path (see reports/FB_META_CONTINUITY_AND_NEWS_AUDIT.md).
forbidden_modules = [
    "signalforge.data.news_ingest",
    "signalforge.data.adapters.massive_news",
    "signalforge.llm.summarize_news",
]

[[tool.importlinter.contracts]]
name = "S13: Signal Forge 1000 is simulated research only — no alerts, no paper acceptance, no LLM, no brokerage"
type = "forbidden"
source_modules = ["signalforge.sf1000"]
forbidden_modules = [
    "signalforge.alerts",
    "signalforge.paper.ledger",
    "signalforge.llm",
    "signalforge.research.promotion",
    "httpx",
    "requests",
]

[[tool.importlinter.contracts]]
name = "S15: the mechanical grid is not a promotion-gated strategy — no candidates, no alerts, no promotion, no LLM, no brokerage"
type = "forbidden"
# The grid is a mechanical rebalancing rule on its own paper account. It must
# never reach the candidate/scan/promotion pipeline, the alert path, or the LLM
# layer — which is also why GridConfig is excluded from the approval scope hash.
source_modules = ["signalforge.grid"]
forbidden_modules = [
    "signalforge.alerts",
    "signalforge.llm",
    "signalforge.research.scan",
    "signalforge.research.candidates",
    "signalforge.research.promotion",
    "signalforge.research.approval_scope",
    "signalforge.paper.ledger",
    "signalforge.paper.auto_simulate",
    "signalforge.data.ingest",
    "signalforge.data.adapters.registry",
    "httpx",
    "requests",
]

[[tool.importlinter.contracts]]
name = "S14: research agents are read-only reporters — no trades, candidates, alerts, settings, promotion, or brokerage"
type = "forbidden"
source_modules = ["signalforge.agents"]
forbidden_modules = [
    "signalforge.paper.ledger",
    "signalforge.alerts.dispatch",
    "signalforge.alerts.channels",
    "signalforge.research.scan",
    "signalforge.research.candidates",
    "signalforge.research.promotion",
    "signalforge.research.persistence",
    "signalforge.data.ingest",
    "signalforge.data.adapters.massive",
    "signalforge.data.adapters.massive_news",
    "signalforge.data.adapters.massive_options",
    "signalforge.data.adapters.stooq",
    "signalforge.data.adapters.registry",
    "signalforge.universe.pipeline",
    "signalforge.killswitch",
    # D6 ADR §17.2: named explicitly here as well as in S15b, so the agents
    # contract states on its own face that no agent reaches an order.
    "signalforge.execution",
    "httpx",
    "requests",
]
# The LLM client is the one sanctioned network path for agents (explanatory
# narratives only, grounded + guarded); it may use httpx as it used the SDK.
ignore_imports = ["signalforge.llm.client -> httpx"]

# ---------------------------------------------------------------------------
# S15a / S15b — the execution boundary (D6 ADR §17.2, I-E1).
#
# These two contracts run in OPPOSITE directions and neither subsumes the other:
# S15a keeps the execution layer away from the layers that must never shape an
# order; S15b keeps every one of those layers away from the execution layer.
# The inbound one is the contract the operator's "no LLM ever decides an order"
# guarantee actually rests on — nothing in the pre-existing contract set stopped
# signalforge.llm / .agents / .app from importing a future signalforge.execution.
#
# `allow_indirect_imports` is deliberately NOT set on either contract. A
# forbidden contract reports indirect chains unless it is set, and an LLM that
# reaches an order through two hops has still reached it. Setting it would be
# the cheap way out of a red build and would make ADR §22's claim of structural
# enforcement false; it must not be taken. The compensating rule is D6 §2: the
# execution job spec is injected from signalforge.cli only, so neither
# signalforge.scheduler nor signalforge/app/** ever gains an import edge.
#
# NOTE (drift hazard recorded rather than silently resolved): the contract named
# plain "S15" above is the mechanical-grid contract and is unrelated to these
# two. The S15a/S15b names come verbatim from D6 ADR §17.2 and are kept so the
# ADR, ARCHITECTURE.md and tests/safety/test_s15_execution_boundary.py all agree.
# ---------------------------------------------------------------------------

# S15a was staged (commented out) in I-E1 because import-linter refuses a missing
# *source* module; signalforge.execution exists as of I-E2, so it is live here.
[[tool.importlinter.contracts]]
name = "S15a: the execution layer never imports the LLM, agents, alerts, scan, or SF1000 layers"
type = "forbidden"
source_modules = ["signalforge.execution"]
forbidden_modules = [
    "signalforge.llm",
    "signalforge.agents",
    "signalforge.alerts",
    "signalforge.research.scan",
    "signalforge.sf1000",
]

[[tool.importlinter.contracts]]
name = "S15b: nothing outside the execution layer may import it — no LLM, agent, app, research, alert, or SF1000 code path reaches an order"
type = "forbidden"
source_modules = [
    "signalforge.llm",
    "signalforge.agents",
    "signalforge.app",
    "signalforge.research",
    "signalforge.alerts",
    "signalforge.sf1000",
    "signalforge.backtest",
    "signalforge.paper",
    "signalforge.portfolio",
    "signalforge.scheduler",
]
# The WHOLE package, not just .brokers. signalforge.cli is deliberately absent
# from the source list: the arming ceremony and the execution command group live
# there, it is the one sanctioned inbound edge, and it is a human-typed entry
# point with no LLM on it (D6 §17.2 note 2). T12 asserts it is the ONLY one.
forbidden_modules = ["signalforge.execution"]
