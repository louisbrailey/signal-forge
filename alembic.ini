# Alembic config. The DB URL is resolved at runtime from Settings.database_url
# (see src/signalforge/db/migrations/env.py) — it is intentionally not set here
# so no connection string is ever committed.
[alembic]
script_location = src/signalforge/db/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
# timezone-aware, sortable revision filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
